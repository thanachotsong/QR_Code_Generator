<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator - SPPH CONNECT</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h1 {
            font-size: 25px;
            color: #333;
            margin-bottom: 20px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            text-align: center;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 8px;
            margin: 10px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        #qrcode {
            margin-top: 20px;
            text-align: center;
        }

        .container {
            text-align: center;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
            box-sizing: border-box;
        }

        .button-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        #downloadBtn {
            background-color: #2196F3;
        }

        #downloadBtn:hover {
            background-color: #1e88e5;
        }

        @media screen and (max-width: 600px) {
            h1 {
                font-size: 1.5rem;
            }

            button {
                padding: 10px 18px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SPPH CONNECT - QR Code Generator for Google Play and App Store</h1>

        <button onclick="generateQRCode()">Generate QR Code</button>

        <div id="qrcode"></div>

        <div class="button-container">
            <button onclick="downloadQRCode()" style="display:none;" id="downloadBtn">Download QR Code</button>
        </div>
    </div>

    <script>
        let qrCodeDataURL = '';

        function generateQRCode() {
            const googlePlayUrl = "https://play.google.com/store/apps/details?id=io.ionic.emrsoft.emrsdpk.spphconnect&hl=th"; // Google Play URL
            const appStoreUrl = "https://apps.apple.com/th/app/spph-connect/id6455889108?l=th"; // App Store URL
            const redirectUrl = getRedirectUrl(googlePlayUrl, appStoreUrl);  // แยกเส้นทางตามระบบปฏิบัติการ

            // ลบ QR Code เก่าทิ้ง
            document.getElementById('qrcode').innerHTML = '';

            // สร้าง QR Code
            QRCode.toDataURL(redirectUrl, { errorCorrectionLevel: 'H' }, function (error, url) {
                if (error) {
                    console.error(error);
                    return;
                }

                qrCodeDataURL = url;  // เก็บ URL ของ QR Code ที่สร้าง

                // แสดง QR Code
                const img = document.createElement('img');
                img.src = qrCodeDataURL;
                document.getElementById('qrcode').appendChild(img);

                // แสดงปุ่มดาวน์โหลด
                document.getElementById('downloadBtn').style.display = 'inline';
            });
        }

        function getRedirectUrl(googlePlayUrl, appStoreUrl) {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    
            // ตรวจสอบว่าเป็น Android หรือ iOS
            if (/android/i.test(userAgent)) {
                return googlePlayUrl;  // หากเป็น Android ให้ไปที่ Google Play
            } else if (/iPhone|iPad|iPod/i.test(userAgent) || navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) {
                return appStoreUrl;  // หากเป็น iOS ให้ไปที่ App Store
            } else {
                return googlePlayUrl;  // หากไม่สามารถตรวจจับได้ ให้ไปที่ Google Play
            }
        }

        function downloadQRCode() {
            if (!qrCodeDataURL) {
                alert('Please generate a QR code first!');
                return;
            }

            // สร้างลิงก์ดาวน์โหลด
            const link = document.createElement('a');
            link.href = qrCodeDataURL;
            link.download = 'qr_code.png';  // ตั้งชื่อไฟล์ที่จะดาวน์โหลด
            link.click();
        }
    </script>
</body>
</html>
